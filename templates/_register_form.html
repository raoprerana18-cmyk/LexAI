

<form action="{{ url_for('auth.register') }}"
      method="POST"
      id="lexaiRegisterForm">

    <div class="lexai-auth-field">
        <label for="name">Full name</label>
        <div class="lexai-auth-input-wrap">
            <i class="bi bi-person"></i>
            <input type="text" id="name" name="name"
                   placeholder="Enter your full name"
                   autocomplete="name" required>
        </div>
    </div>

    <div class="lexai-auth-field">
        <label for="email">Email address</label>
        <div class="lexai-auth-input-wrap">
            <i class="bi bi-envelope"></i>
            <input type="email" id="email" name="email"
                   placeholder="you@example.com"
                   autocomplete="email" required>
        </div>
    </div>

    <div class="lexai-auth-field">
        <label for="password">Password</label>
        <div class="lexai-auth-input-wrap">
            <i class="bi bi-lock"></i>
            <input type="password" id="password" name="password"
                   placeholder="At least 8 characters"
                   minlength="8" autocomplete="new-password" required>
            <button type="button" class="lexai-password-toggle"
                    data-password-target="password"
                    aria-label="Show password" aria-pressed="false">
                <i class="bi bi-eye"></i>
            </button>
        </div>
        <small class="lexai-auth-hint">
            <i class="bi bi-shield-check"></i>
            Use at least 8 characters.
        </small>
    </div>

    <div class="lexai-auth-field">
        <label for="confirm_password">Confirm password</label>
        <div class="lexai-auth-input-wrap">
            <i class="bi bi-lock-fill"></i>
            <input type="password" id="confirm_password"
                   name="confirm_password"
                   placeholder="Re-enter your password"
                   minlength="8" autocomplete="new-password" required>
            <button type="button" class="lexai-password-toggle"
                    data-password-target="confirm_password"
                    aria-label="Show confirm password" aria-pressed="false">
                <i class="bi bi-eye"></i>
            </button>
        </div>
        <small id="lexaiPasswordMessage"
               class="lexai-auth-validation" aria-live="polite"></small>
    </div>

    <button type="submit" class="lexai-auth-submit">
        <span>Create Account</span>
        <i class="bi bi-arrow-right"></i>
    </button>
</form>
