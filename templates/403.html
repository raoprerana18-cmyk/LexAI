{% extends "base.html" %}
{% block title %}Access Denied{% endblock %}
{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h1 class="display-1 text-danger fw-bold"><i class="bi bi-shield-lock"></i> 403</h1>
            <h3 class="fw-bold mb-3">Access Denied</h3>
            <p class="text-muted mb-4">You do not have permission to view this resource. This action has been logged.</p>
            <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary px-4 py-2">Return to Dashboard</a>
        </div>
    </div>
</div>
{% endblock %}
