{% extends "base.html" %}
{% block title %}Internal Server Error{% endblock %}
{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h1 class="display-1 text-secondary fw-bold"><i class="bi bi-gear-wide-connected"></i> 500</h1>
            <h3 class="fw-bold mb-3">Internal Server Error</h3>
            <p class="text-muted mb-4">Something went wrong on our servers. We have logged the error and are looking into it.</p>
            <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary px-4 py-2">Return to Dashboard</a>
        </div>
    </div>
</div>
{% endblock %}
