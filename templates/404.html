{% extends "base.html" %}
{% block title %}Page Not Found{% endblock %}
{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h1 class="display-1 text-warning fw-bold"><i class="bi bi-exclamation-triangle"></i> 404</h1>
            <h3 class="fw-bold mb-3">Page Not Found</h3>
            <p class="text-muted mb-4">The page you are looking for does not exist or has been moved.</p>
            <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary px-4 py-2">Return to Dashboard</a>
        </div>
    </div>
</div>
{% endblock %}
